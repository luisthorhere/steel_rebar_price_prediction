name: Update Steel Rebar Model

on:
  schedule:
    - cron: '0 3 * * *'  # Corre todos los días a las 03:00 UTC
  workflow_dispatch:

concurrency:
  group: update-model
  cancel-in-progress: true

jobs:
  update-model:
    runs-on: ubuntu-latest
    env:
      # Project ID (opcional para libs que lo lean de env)
      GOOGLE_CLOUD_PROJECT: deacero-api
      # Nombre del bucket; guardaste esto en el secret GCP_CLOUD_STORAGE
      GCS_BUCKET: ${{ secrets.GCP_CLOUD_STORAGE }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Si ya tienes todo en requirements.txt, puedes omitir las líneas extra
          pip install -r requirements.txt
          pip install google-cloud-storage pandas scikit-learn

      # Autenticación con la Service Account (clave JSON pegada en el secret GCP_SA_KEY)
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Prueba de humo: validar acceso al bucket
      - name: Smoke test - access GCS bucket
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ.get("GCS_BUCKET")
          if not bucket_name:
            raise SystemExit("GCS_BUCKET no está definido (revisa tu secret GCP_CLOUD_STORAGE).")

          client = storage.Client()
          # Get bucket metadata to ensure access
          bucket = client.bucket(bucket_name)
          _ = bucket.labels  # acceso a metadatos
          # Listar hasta 5 objetos para ver que responde
          names = [b.name for b in client.list_blobs(bucket_name, max_results=5)]
          print(f"[OK] Acceso a gs://{bucket_name}. Ejemplos: {names}")
          EOF

      # Ejecuta tu actualización de datos / reentrenamiento
      - name: Run update_data.py
        run: |
          set -e
          if [ -f "scripts/update_data.py" ]; then
            python scripts/update_data.py
          elif [ -f "update_data.py" ]; then
            python update_data.py
          else
            echo "::error::No se encontró scripts/update_data.py ni update_data.py"
            exit 1
          fi

      # Sube los artefactos generados al bucket
      - name: Upload model and data to GCS
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          BUCKET_NAME = os.environ["GCS_BUCKET"]
          # Ajusta esta lista a los nombres reales que produce tu script
          FILES_TO_UPLOAD = ["model.pkl", "rebar_data.csv"]

          client = storage.Client()
          bucket = client.bucket(BUCKET_NAME)

          missing = []
          for file_name in FILES_TO_UPLOAD:
            if not os.path.exists(file_name):
              print(f"[WARN] {file_name} no existe; se omite.")
              missing.append(file_name)
              continue
            blob = bucket.blob(file_name)
            blob.upload_from_filename(file_name)
            print(f"[OK] Subido: gs://{BUCKET_NAME}/{file_name}")

          # Si nada se subió, marca como warning pero no falla el job
          if len(missing) == len(FILES_TO_UPLOAD):
            print("::warning::No se encontró ningún archivo para subir (revisa la salida de update_data.py)")
          EOF

      # (Opcional) Publica logs/artefactos locales si algo falla
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            **/*.log
            **/training_logs/*
          if-no-files-found: ignore
