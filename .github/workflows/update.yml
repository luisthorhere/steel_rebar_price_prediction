name: Update Steel Rebar Model

on:
  schedule:
    - cron: '0 3 * * *'  # Corre todos los días a las 03:00 UTC
  workflow_dispatch:

# Permisos mínimos (auth con credentials_json no requiere id-token)
permissions:
  contents: read

concurrency:
  group: update-model
  cancel-in-progress: true

jobs:
  update-model:
    runs-on: ubuntu-latest

    # Variables de entorno que usará todo el job
    env:
      # Project ID (algunas libs lo leen de aquí)
      GOOGLE_CLOUD_PROJECT: deacero-api
      # Nombre del bucket desde Repository secrets
      GCS_BUCKET: ${{ secrets.GCP_CLOUD_STORAGE }}
      # Para logs sin buffer en Python
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Si ya está en requirements.txt, estas se omiten, pero no estorban:
          pip install google-cloud-storage pandas scikit-learn

      # Validación temprana: verifica que los secrets estén presentes
      - name: Preflight - check required secrets and env
        run: |
          test -n "${{ secrets.GCP_SA_KEY }}" || { echo "::error::Falta Repository secret GCP_SA_KEY"; exit 1; }
          test -n "${{ secrets.GCP_CLOUD_STORAGE }}" || { echo "::error::Falta Repository secret GCP_CLOUD_STORAGE (nombre del bucket)"; exit 1; }
          echo "[OK] Secrets presentes. Bucket: $GCS_BUCKET"

      # Autenticación con la Service Account usando el JSON del secret
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Prueba de humo: validar acceso al bucket
      - name: Smoke test - access GCS bucket
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ.get("GCS_BUCKET")
          if not bucket_name:
            raise SystemExit("GCS_BUCKET no está definido (revisa tu Repository secret GCP_CLOUD_STORAGE).")

          client = storage.Client()
          # Consultar metadatos para confirmar acceso
          bucket = client.bucket(bucket_name)
          _ = bucket.labels  # acceso a metadatos sin listar todo
          # Listar hasta 5 objetos
          names = [b.name for b in client.list_blobs(bucket_name, max_results=5)]
          print(f"[OK] Acceso a gs://{bucket_name}. Ejemplos: {names}")
          EOF

      # Ejecuta tu actualización de datos / reentrenamiento
      - name: Run update_data.py
        run: |
          set -e
          if [ -f "scripts/update_data.py" ]; then
            python scripts/update_data.py
          elif [ -f "update_data.py" ]; then
            python update_data.py
          else
            echo "::error::No se encontró scripts/update_data.py ni update_data.py"
            exit 1
          fi

      # Sube los artefactos generados al bucket
      - name: Upload model and data to GCS
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          BUCKET_NAME = os.environ["GCS_BUCKET"]
          # Ajusta esta lista a los nombres reales que produce tu script
          FILES_TO_UPLOAD = ["model.pkl", "rebar_data.csv"]

          client = storage.Client()
          bucket = client.bucket(BUCKET_NAME)

          uploaded = 0
          for file_name in FILES_TO_UPLOAD:
            if not os.path.exists(file_name):
              print(f"[WARN] {file_name} no existe; se omite.")
              continue
            blob = bucket.blob(file_name)
            blob.upload_from_filename(file_name)
            print(f"[OK] Subido: gs://{BUCKET_NAME}/{file_name}")
            uploaded += 1

          if uploaded == 0:
            print("::warning::No se subió ningún archivo (revisa la salida de update_data.py y FILES_TO_UPLOAD)")
          EOF

      # (Opcional) Publica logs/artefactos locales si algo falla
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: |
            **/*.log
            **/training_logs/*
          if-no-files-found: ignore
