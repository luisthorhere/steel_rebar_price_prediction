name: Update Steel Rebar Model

on:
  schedule:
    - cron: '0 3 * * *'  # Corre todos los días a las 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-model
  cancel-in-progress: true

jobs:
  update-model:
    runs-on: ubuntu-latest

    env:
      # ID del proyecto en GCP
      GOOGLE_CLOUD_PROJECT: deacero_api
      # Nombre fijo del bucket
      GCS_BUCKET: deacero_steel_rebar_models
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Dependencias comunes (en caso de no estar en requirements.txt)
          pip install google-cloud-storage pandas scikit-learn

      # Verifica que el secret GCP_SA_KEY esté presente
      - na
